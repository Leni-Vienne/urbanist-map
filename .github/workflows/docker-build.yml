name: Build and Push Docker Image

on:
  push:
    branches: "**"

jobs:
  docker-build:
    runs-on: self-hosted
    environment: preview
    #environment: ${{ github.event_name == 'pull_request' && 'preview' || (github.ref == 'refs/heads/production' && 'production' || 'preview') }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set environment variables
      id: env-vars
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "IMAGE_TAG=preview" >> $GITHUB_ENV
          echo "DEPLOY_TARGET=preview" >> $GITHUB_ENV
          echo "image-tag=preview" >> $GITHUB_OUTPUT
          echo "deploy-target=preview" >> $GITHUB_OUTPUT
        elif [ "${{ github.ref }}" = "refs/heads/production" ]; then
          echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          echo "DEPLOY_TARGET=production" >> $GITHUB_ENV
          echo "image-tag=latest" >> $GITHUB_OUTPUT
          echo "deploy-target=production" >> $GITHUB_OUTPUT
        else
          echo "IMAGE_TAG=preview" >> $GITHUB_ENV
          echo "DEPLOY_TARGET=preview" >> $GITHUB_ENV
          echo "image-tag=preview" >> $GITHUB_OUTPUT
          echo "deploy-target=preview" >> $GITHUB_OUTPUT
        fi

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}-server
        tags: |
          type=raw,value=${{ steps.env-vars.outputs.image-tag }}
          type=sha,prefix={{branch}}-
          type=ref,event=branch
          type=ref,event=pr

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

    - name: Show deployment information
      run: |
        echo "🐳 Docker image built and pushed successfully!"
        echo "📦 Repository: ghcr.io/${{ github.repository }}-server"
        echo "🏷️ Tags: ${{ steps.meta.outputs.tags }}"
        echo "🚀 Target environment: ${{ steps.env-vars.outputs.deploy-target }}"

    - name: Comment on PR with Docker image info
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const imageUrl = `ghcr.io/${{ github.repository }}-server:preview`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `🐳 **Docker image built successfully!**\n\n📦 **Image**: \`${imageUrl}\`\n\n🚀 **Run locally**:\n\`\`\`bash\ndocker pull ${imageUrl}\ndocker run -p 3000:3000 -e DATABASE_URL="your-database-url" ${imageUrl}\n\`\`\`\n\n⚠️ **Note**: This is a preview build. Production images are built from the \`production\` branch.`
          })

    - name: Security scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ghcr.io/${{ github.repository }}-server:${{ steps.env-vars.outputs.image-tag }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
