# Deploys frontend to Cloudflare Pages and backend to Docker Compose on the
# self-hosted runner. Production stack lives in /opt/construction-map-prod,
# preview stack in /opt/construction-map-preview (separate DBs, ports, R2
# buckets). See docs/DEPLOYMENT.md for the stack-by-stack reference table.

name: Deploy and Migrate Split

on:
  push:
    branches: ["preview", "production"]
  # to manually deploy on github
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-and-migrate:
    # Runner must be hardcoded - environment vars aren't available at runs-on evaluation time
    runs-on:
      - self-hosted
      - home-github-runner
    environment: ${{ github.event_name == 'pull_request' && 'preview' || (github.ref == 'refs/heads/production' && 'production' || 'preview') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

        # needed for wrangler deploy (cloudflare)
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Set environment variables
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "WRANGLER_ENV=preview" >> $GITHUB_ENV
            echo "DEPLOY_TARGET=preview" >> $GITHUB_ENV
            echo "DB_PORT=5433" >> $GITHUB_ENV
            echo "DB_NAME=construction_map_preview" >> $GITHUB_ENV
          elif [ "${{ github.ref }}" = "refs/heads/production" ]; then
            echo "WRANGLER_ENV=" >> $GITHUB_ENV
            echo "DEPLOY_TARGET=production" >> $GITHUB_ENV
            echo "DB_PORT=5432" >> $GITHUB_ENV
            echo "DB_NAME=construction_map" >> $GITHUB_ENV
          else
            echo "WRANGLER_ENV=preview" >> $GITHUB_ENV
            echo "DEPLOY_TARGET=preview" >> $GITHUB_ENV
            echo "DB_PORT=5433" >> $GITHUB_ENV
            echo "DB_NAME=construction_map_preview" >> $GITHUB_ENV
          fi

      - name: Run database migrations
        run: |
          # Only the genuine "database not up yet" case (fresh host, Postgres container not
          # started until a later step) should be tolerated. A reachable DB that fails to
          # migrate is a real error and must fail the deploy, not be swallowed.
          if command -v pg_isready >/dev/null 2>&1 && pg_isready -h localhost -p "$DB_PORT" >/dev/null 2>&1; then
            DB_UP=1
          elif timeout 3 bash -c "cat < /dev/null > /dev/tcp/localhost/$DB_PORT" >/dev/null 2>&1; then
            DB_UP=1
          else
            DB_UP=0
          fi

          if [ "$DB_UP" = "1" ]; then
            echo "Database reachable on localhost:$DB_PORT — running migrations"
            bun run db:migrate
          else
            echo "⚠️ Database not reachable on localhost:$DB_PORT — skipping migration (fresh deployment)"
          fi
        env:
          DATABASE_URL: postgres://postgres:${{ secrets.POSTGRES_PASSWORD }}@localhost:${{ env.DB_PORT }}/${{ env.DB_NAME }}

      - name: Build frontend
        run: bun run build-front-workflow
        env:
          VITE_R2_PUBLIC_URL: ${{ vars.VITE_R2_PUBLIC_URL }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          NODE_ENV: production

      - name: Build backend bundle
        run: bun run build-back
        env:
          NODE_ENV: production

      - name: Deploy frontend to Cloudflare Pages
        id: deploy-frontend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy front/dist --project-name=${{ env.WRANGLER_ENV == '' && 'construction-map' || 'construction-map-preview' }} --branch=production --commit-dirty=true

      - name: Extract frontend URL
        id: extract-url
        run: |
          # Use FRONTEND_URL from GitHub environment variables instead of hardcoding
          FRONTEND_URL="${{ vars.FRONTEND_URL }}"
          if [ "${{ env.WRANGLER_ENV }}" = "" ]; then
            echo "PROJECT_NAME=construction-map" >> $GITHUB_ENV
          else
            echo "PROJECT_NAME=construction-map-preview" >> $GITHUB_ENV
          fi
          echo "FRONTEND_URL=$FRONTEND_URL" >> $GITHUB_ENV
          echo "Frontend deployed to: $FRONTEND_URL"

      - name: Cleanup old Cloudflare Pages deployments
        run: |
          # Keep only the 5 most recent deployments, delete the rest
          DEPLOYMENTS=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/pages/projects/${{ env.PROJECT_NAME }}/deployments" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json")

          # Extract deployment IDs, skip the first 5 (most recent), delete the rest
          echo "$DEPLOYMENTS" | jq -r '.result[5:] | .[].id' | while read -r DEPLOYMENT_ID; do
            if [ -n "$DEPLOYMENT_ID" ]; then
              echo "Deleting old deployment: $DEPLOYMENT_ID"
              curl -s -X DELETE \
                "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/pages/projects/${{ env.PROJECT_NAME }}/deployments/$DEPLOYMENT_ID?force=true" \
                -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
                -H "Content-Type: application/json"
            fi
          done
          echo "Old deployments cleanup complete"

      - name: Deploy backend with docker compose
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          OSM_CLIENT_ID: ${{ secrets.OSM_CLIENT_ID }}
          OSM_CLIENT_SECRET: ${{ secrets.OSM_CLIENT_SECRET }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          SES_REGION: ${{ vars.SES_REGION }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          LOKI_URL: ${{ vars.LOKI_URL }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

        run: |
          # Determine environment-specific values
          if [ "${{ env.DEPLOY_TARGET }}" = "production" ]; then
            DEPLOY_DIR="/opt/construction-map-prod"
            COMPOSE_PROJECT_NAME="construction-map-prod"
            POSTGRES_DB="construction_map"
            DB_PORT="5432"
            BACKEND_PORT="3000"
            ALLOY_PORT="12345"
            DATABASE_URL="postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/construction_map"
          else
            DEPLOY_DIR="/opt/construction-map-preview"
            COMPOSE_PROJECT_NAME="construction-map-preview"
            POSTGRES_DB="construction_map_preview"
            DB_PORT="5433"
            BACKEND_PORT="3001"
            ALLOY_PORT="12346"
            DATABASE_URL="postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/construction_map_preview"
          fi

          # Check if files exist
          ls -la server.bundle.js docker-compose.yml alloy-config.alloy
          ls -la back/src/email back/src/routes

          # Conditionally install Caddy if reverse proxy is enabled
          if [ "${{ vars.INCLUDE_REVERSE_PROXY }}" = "true" ]; then
            if ! command -v caddy &> /dev/null; then
              echo "Installing Caddy..."
              sudo apt install -y debian-keyring debian-archive-keyring apt-transport-https curl
              curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
              curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list
              sudo apt update
              sudo apt install -y caddy
              sudo systemctl enable caddy
            fi
          fi

          # Create deployment directory and stop existing containers
          sudo mkdir -p ${DEPLOY_DIR}
          sudo docker compose -f ${DEPLOY_DIR}/docker-compose.yml down || true

          # Copy new files directly (runner is the deployment host)
          sudo cp ./server.bundle.js ${DEPLOY_DIR}/
          sudo cp ./docker-compose.yml ${DEPLOY_DIR}/
          # Remove old alloy config if it's a directory (Docker creates it on failed mount)
          sudo rm -rf ${DEPLOY_DIR}/alloy-config.alloy
          sudo cp ./alloy-config.alloy ${DEPLOY_DIR}/
          # Copy email templates and routes directories
          sudo mkdir -p ${DEPLOY_DIR}/back/src
          sudo rm -rf ${DEPLOY_DIR}/back/src/email
          sudo cp -r ./back/src/email ${DEPLOY_DIR}/back/src/
          sudo rm -rf ${DEPLOY_DIR}/back/src/routes
          sudo cp -r ./back/src/routes ${DEPLOY_DIR}/back/src/

          # Ensure uploads bind-mount target exists and is owned by the container's bun user (UID 1000).
          sudo mkdir -p ${DEPLOY_DIR}/uploads
          sudo chown -R 1000:1000 ${DEPLOY_DIR}/uploads

          # Create .env file from GitHub secrets/vars with environment-specific values
          sudo tee ${DEPLOY_DIR}/.env > /dev/null <<EOF
          COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}
          NODE_ENV=${{ env.DEPLOY_TARGET }}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          DATABASE_URL=${DATABASE_URL}
          DB_PORT=${DB_PORT}
          BACKEND_PORT=${BACKEND_PORT}
          ALLOY_PORT=${ALLOY_PORT}
          LOKI_URL=${LOKI_URL}
          COOKIE_SECRET=${COOKIE_SECRET}
          CORS_ORIGIN=${CORS_ORIGIN}
          VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
          VITE_API_BASE_URL=${VITE_API_BASE_URL}
          OSM_CLIENT_ID=${OSM_CLIENT_ID}
          OSM_CLIENT_SECRET=${OSM_CLIENT_SECRET}
          FRONTEND_URL=${FRONTEND_URL}
          PORT=3000
          ALERT_EMAIL=${ALERT_EMAIL}
          SMTP_USERNAME=${SMTP_USERNAME}
          SMTP_PASSWORD=${SMTP_PASSWORD}
          SES_REGION=${SES_REGION}
          FROM_EMAIL=${FROM_EMAIL}
          R2_ENDPOINT=${R2_ENDPOINT}
          R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
          R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
          R2_BUCKET_NAME=${R2_BUCKET_NAME}
          TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
          DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
          EOF

          # Start services
          sudo docker compose -f ${DEPLOY_DIR}/docker-compose.yml up -d

          # Show status
          sudo docker compose -f ${DEPLOY_DIR}/docker-compose.yml ps

          # Conditionally deploy Caddyfile and reload if reverse proxy is enabled
          if [ "${{ vars.INCLUDE_REVERSE_PROXY }}" = "true" ]; then
            sudo cp ./Caddyfile.host /etc/caddy/Caddyfile
            sudo systemctl reload caddy
            echo "Caddy configuration deployed and reloaded"
          fi

      - name: Comment on PR with deployment status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentUrl = 'https://construction-map-preview.leni-vienne2.workers.dev';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ PR deployed to split environment for testing!\n\n🔗 **Frontend URL**: ${deploymentUrl}\n🖥️ **Backend**: Self-hosted with Docker Compose (DB + API)\n🗄️ **Database**: Self-hosted PostgreSQL\n\n⚠️ **Note**: This is a preview deployment. Production deployment happens only after merging to \`production\` branch.`
