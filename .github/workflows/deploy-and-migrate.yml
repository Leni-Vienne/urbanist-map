name: Deploy and Migrate

on:
  push:
    branches: [production, preview]
  pull_request:
    branches: [production]

jobs:
  deploy-and-migrate:
    runs-on: self-hosted
    environment: ${{ github.event_name == 'pull_request' && 'preview' || (github.ref == 'refs/heads/production' && 'production' || 'preview') }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Set environment variables
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "WRANGLER_ENV=preview" >> $GITHUB_ENV
          echo "DEPLOY_TARGET=preview" >> $GITHUB_ENV
        elif [ "${{ github.ref }}" = "refs/heads/production" ]; then
          echo "WRANGLER_ENV=" >> $GITHUB_ENV
          echo "DEPLOY_TARGET=production" >> $GITHUB_ENV
        else
          echo "WRANGLER_ENV=preview" >> $GITHUB_ENV
          echo "DEPLOY_TARGET=preview" >> $GITHUB_ENV
        fi

    - name: Run database migrations
      run: bun run db:migrate
      env:
        DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}

    - name: Build frontend
      run: bun run build-front-workflow
      env:
        VITE_R2_PUBLIC_URL: ${{ vars.VITE_R2_PUBLIC_URL }}

    - name: Show deployment target
      run: |
        echo "🚀 Deploying to: ${{ env.DEPLOY_TARGET }} environment"
        echo "📦 Wrangler environment: '${{ env.WRANGLER_ENV }}'"

    - name: Deploy to Cloudflare Workers
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CF_API_TOKEN }}
        accountId: ${{ secrets.CF_ACCOUNT_ID }}
        command: deploy --env="${{ env.WRANGLER_ENV }}"
        secrets: |
          SESSION_ENCRYPTION_KEY
      env:
        SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}

    - name: Comment on PR with deployment status
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const deploymentUrl = 'https://construction-map-preview.leni-vienne2.workers.dev';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `✅ PR deployed to preview environment for testing!\n\n🔗 **Preview URL**: ${deploymentUrl}\n\n📊 **Database**: Preview environment (isolated from production)\n\n⚠️ **Note**: This is a preview deployment. Production deployment happens only after merging to \`production\` branch.`
          })