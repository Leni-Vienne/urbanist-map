name: Deploy and Migrate

on:
  push:
    branches: [production, preview]
  pull_request:
    branches: [production]

jobs:
  deploy-and-migrate:
    runs-on: self-hosted
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Set environment variables
      run: |
        if [ "${{ github.ref }}" = "refs/heads/main" ]; then
          echo "WORKER_NAME=construction-map" >> $GITHUB_ENV
        else
          echo "WORKER_NAME=construction-map-preview" >> $GITHUB_ENV
        fi

    - name: Run database migrations
      run: bun run db:migrate
      env:
        DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}

    - name: Build frontend
      run: bun run build-front

    - name: Deploy to Cloudflare Workers
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CF_API_TOKEN }}
        accountId: ${{ secrets.CF_ACCOUNT_ID }}
        command: deploy ${{ github.ref == 'refs/heads/main' && '' || '--env preview' }}
        secrets: |
          SESSION_ENCRYPTION_KEY
      env:
        SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}

    - name: Comment on PR with deployment status
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const deploymentUrl = 'https://construction-map-preview.workers.dev';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `✅ Preview deployment completed successfully!\n\n🔗 **Preview URL**: ${deploymentUrl}\n\n📊 **Database**: Preview environment with latest migrations applied`
          })