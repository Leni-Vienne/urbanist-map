# AI : Cloudflare Worker configuration
name = "construction-map-api"
main = "worker/index.ts"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]

# AI : R2 bucket binding for file uploads
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "construction-map-uploads"

# AI : Observability configuration
[observability.logs]
enabled = true

# AI : Environment variables for Worker
[vars]
CORS_ORIGIN = "https://construction-map.pages.dev"

# AI : Secrets to be set in Cloudflare dashboard
# DATABASE_URL (Supabase PostgreSQL URL)
# SUPABASE_URL 
# SUPABASE_ANON_KEY
# SESSION_ENCRYPTION_KEY
# CF_ACCOUNT_ID (for Cloudflare Images)
# CF_API_TOKEN (for Cloudflare Images)
