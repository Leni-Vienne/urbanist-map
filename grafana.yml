      description: Latency quantile curve per route over the whole selected window. Each line reads left to right as "this share of requests finished at or below this latency", so a line that stays flat and lifts only at its right-hand end has a slow tail rather than a slow typical case. Only successful (status under 400) requests to served prefixes are included, which excludes scanner probes for paths the app does not route. Paths are normalised into route templates - tile coordinates, upload filenames, SEO slugs and numeric ids collapse into placeholders, and a batched tRPC call is attributed to the first procedure in its batch.
