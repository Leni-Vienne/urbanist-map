annotations:
  - kind: AnnotationQuery
    spec:
      builtIn: true
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      query:
        datasource:
          name: "-- Grafana --"
        group: grafana
        kind: DataQuery
        spec: {}
        version: v0
cursorSync: "Off"
description: Request traffic, bot classification, and identity analysis for the selected backend. Health checks (/api/health) are excluded by the bot classification filters. Use the time picker to select the aggregation window; only the request-rate panel charts time.
editable: true
elements:
  panel-1:
    kind: Panel
    spec:
      data:
        kind: QueryGroup
        spec:
          queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: grafanacloud-logs
                  group: loki
                  kind: DataQuery
                  spec:
                    app: grafana-assistant-app
                    direction: backward
                    editorMode: code
                    expr: |-
                      sum by (cfCountry, botKind) (
                        count_over_time({container=~".*${backend:regex}", cfCountry!="", botKind=~"human|bot"} [$__range])
                      ) and on (cfCountry) topk(15, sum by (cfCountry) (
                        count_over_time({container=~".*${backend:regex}", cfCountry!="", botKind=~"human|bot"} [$__range])
                      ))
                    instant: true
                    legendFormat: "{{cfCountry}} {{botKind}}"
                    queryType: instant
                    range: false
                  version: v0
                refId: A
          queryOptions: {}
          transformations:
            - kind: Transformation
              group: labelsToFields
              spec:
                options: {}
            - kind: Transformation
              group: groupingToMatrix
              spec:
                options:
                  columnField: botKind
                  rowField: cfCountry
                  valueField: "Value #A"
      description: Top 15 Cloudflare country codes by classified traffic in the selected time window, split into human and bot requests. Empty country codes and unclassified requests are excluded.
      id: 1
      links: []
      title: Requests by country
      vizConfig:
        group: barchart
        kind: VizConfig
        spec:
          fieldConfig:
            defaults:
              color:
                mode: palette-classic
              custom:
                axisBorderShow: false
                axisCenteredZero: false
                axisColorMode: text
                axisLabel: ""
                axisPlacement: auto
                fillOpacity: 80
                gradientMode: none
                hideFrom:
                  legend: false
                  tooltip: false
                  viz: false
                lineWidth: 1
                scaleDistribution:
                  type: linear
                thresholdsStyle:
                  mode: "off"
              thresholds:
                mode: absolute
                steps:
                  - color: green
                    value: 0
                  - color: red
                    value: 80
            overrides: []
          options:
            annotations:
              clustering: -1
              multiLane: false
            barRadius: 0
            barWidth: 0.97
            fullHighlight: false
            groupWidth: 0.7
            legend:
              calcs:
                - sum
              displayMode: table
              enableFacetedFilter: false
              overflow: ellipsis
              placement: right
              showLegend: true
            orientation: horizontal
            showValue: auto
            stacking: normal
            tooltip:
              hideZeros: false
              mode: multi
              sort: desc
            xTickLabelRotation: 0
            xTickLabelSpacing: 0
        version: 13.2.0-29316898481
