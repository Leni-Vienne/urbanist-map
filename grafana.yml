annotations:
  - kind: AnnotationQuery
    spec:
      builtIn: true
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      query:
        datasource:
          name: "-- Grafana --"
        group: grafana
        kind: DataQuery
        spec: {}
        version: v0
cursorSync: "Off"
description: Request traffic, bot classification, and identity analysis for the selected backend. All counts are origin-side — only requests that reach the API backend appear. The Pages-hosted frontend, edge-cached assets, and requests Cloudflare blocks never reach it, so Cloudflare's zone-wide visitor numbers sit far above every panel here. Health checks (/api/health) are excluded by the bot classification filters. Route panels normalise paths into templates at query time - path is a log field, not a Loki label, so it is parsed per request rather than indexed. Use the time picker to select the aggregation window; only the request-rate panel charts time.
editable: true
elements:
  panel-1:
    kind: Panel
    spec:
      data:
        kind: QueryGroup
        spec:
          queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: grafanacloud-logs
                  group: loki
                  kind: DataQuery
                  spec:
                    app: grafana-assistant-app
                    direction: backward
                    editorMode: code
                    expr: |-
                      count by (cfCountry, botKind) (
                        sum by (cfCountry, botKind, visitorId) (
                          count_over_time({container=~".*${backend:regex}", cfCountry!="", botKind!=""} | json visitorId [$__range])
                        )
                      ) and on (cfCountry) topk(15, count by (cfCountry) (
                        sum by (cfCountry, visitorId) (
                          count_over_time({container=~".*${backend:regex}", cfCountry!="", botKind!=""} | json visitorId [$__range])
                        )
                      ))
                    instant: true
                    legendFormat: "{{cfCountry}} {{botKind}}"
                    queryType: instant
                    range: false
                  version: v0
                refId: A
          queryOptions: {}
          transformations:
            - kind: Transformation
              group: labelsToFields
              spec:
                options: {}
            - kind: Transformation
              group: groupingToMatrix
              spec:
                options:
                  columnField: botKind
                  rowField: cfCountry
                  valueField: "Value #A"
      description: Top 15 Cloudflare country codes by distinct anonymous visitors in the selected time window, split into human, bot, and unknown. Counts only visitors whose requests reached the API origin; empty country codes (direct-to-origin traffic) are excluded. Cloudflare's zone-wide unique-visitor count measures the edge — including the Pages-hosted frontend, cached assets, and blocked requests — and sits far above this.
      id: 1
      links: []
      title: Unique visitors by country
      vizConfig:
        group: barchart
        kind: VizConfig
        spec:
          fieldConfig:
            defaults:
              color:
                mode: palette-classic
              custom:
                axisBorderShow: false
                axisCenteredZero: false
                axisColorMode: text
                axisLabel: ""
                axisPlacement: auto
                fillOpacity: 80
                gradientMode: none
                hideFrom:
                  legend: false
                  tooltip: false
                  viz: false
                lineWidth: 1
                scaleDistribution:
                  type: linear
                thresholdsStyle:
                  mode: "off"
              thresholds:
                mode: absolute
                steps:
                  - color: green
                    value: 0
                  - color: red
                    value: 80
            overrides:
              - matcher:
                  id: byName
                  options: human
                properties:
                  - id: color
                    value:
                      fixedColor: green
                      mode: fixed
              - matcher:
                  id: byName
                  options: bot
                properties:
                  - id: color
                    value:
                      fixedColor: orange
                      mode: fixed
              - matcher:
                  id: byName
                  options: unknown
                properties:
                  - id: color
                    value:
                      fixedColor: "#9e9e9e"
                      mode: fixed
          options:
            annotations:
              clustering: -1
              multiLane: false
            barRadius: 0
            barWidth: 0.97
            fullHighlight: false
            groupWidth: 0.7
            legend:
              calcs:
                - sum
              displayMode: table
              enableFacetedFilter: false
              overflow: ellipsis
              placement: right
              showLegend: true
            orientation: horizontal
            showValue: auto
            stacking: normal
            tooltip:
              hideZeros: false
              mode: multi
              sort: desc
            xTickLabelRotation: 0
            xTickLabelSpacing: 0
        version: 13.2.0-29316898481
  panel-10:
