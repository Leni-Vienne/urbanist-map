# Grafana dashboard resource. Setup and query limitations: docs/GRAFANA_OSM.md
apiVersion: dashboard.grafana.app/v2
kind: Dashboard
metadata:
  name: levfnhb
spec:
  annotations: []
  cursorSync: "Off"
  description:
    Daily OSM updates from structured logfmt script events and systemd journal messages. Requires the grafanacloud-logs
    Loki data source and JOURNAL_UNIT=osm-update.service on one Alloy stack. Charts show history across the selected time range, connecting reported samples with visible markers. They do not join events into runs. See docs/GRAFANA_OSM.md for setup and limitations.
  editable: true
  elements:
    panel-4:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    datasource:
                      name: grafanacloud-logs
                    group: loki
                    kind: DataQuery
                    spec:
                      direction: backward
                      editorMode: code
                      expr: |-
                        last_over_time(
                          {service="osm-update"}
                          | logfmt
                          | event="step_completed" | step="total"
                          | component=~"linear|areal" | dry_run="0"
                          | unwrap duration_seconds
                          | __error__="" [$__interval]
                        ) by (component)
                      instant: false
                      legendFormat: "{{component}}"
                      queryType: range
                      range: true
                    version: v0
                  refId: A
            queryOptions:
              interval: 1h
            transformations: []
        description:
          Last reported total duration per extractor in each display interval (minimum one hour). Durations
          use a monotonic clock; the Python logging handler flushes each event immediately.
        id: 4
        links: []
        title: Extraction durations
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                unit: s
                noValue: No matching logs
                color:
                  mode: palette-classic
                custom:
                  drawStyle: line
                  lineWidth: 2
                  pointSize: 6
                  showPoints: always
                  spanNulls: true
                  axisCenteredZero: false
                  axisPlacement: auto
                  fillOpacity: 0
              overrides: []
            options:
              legend:
                calcs:
                  - lastNotNull
                displayMode: table
                placement: right
                showLegend: true
              tooltip:
                mode: multi
                sort: desc
          version: 13.2.0-29316898481
    panel-6:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    datasource:
                      name: grafanacloud-logs
                    group: loki
                    kind: DataQuery
                    spec:
                      direction: backward
                      editorMode: code
                      expr: |-
                        last_over_time(
                          {service="osm-update"}
                          |= "Finished " |= ".geojson. Inserted:"
                          | regexp `Finished (?P<file>[^/ ]+[.]geojson)[.] Inserted: (?P<inserted>[0-9]+), unchanged: (?P<unchanged>[0-9]+), skipped: (?P<skipped>[0-9]+)`
                          | file!=""
                          | unwrap inserted
                          | __error__="" [$__interval]
                        ) by (file)
                      instant: false
                      legendFormat: "{{file}} / new or changed"
                      queryType: range
                      range: true
                    version: v0
                  refId: A
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    datasource:
                      name: grafanacloud-logs
                    group: loki
                    kind: DataQuery
                    spec:
                      direction: backward
                      editorMode: code
                      expr: |-
                        last_over_time(
                          {service="osm-update"}
                          |= "Finished " |= ".geojson. Inserted:"
                          | regexp `Finished (?P<file>[^/ ]+[.]geojson)[.] Inserted: (?P<inserted>[0-9]+), unchanged: (?P<unchanged>[0-9]+), skipped: (?P<skipped>[0-9]+)`
                          | file!=""
                          | unwrap skipped
                          | __error__="" [$__interval]
                        ) by (file)
                      instant: false
                      legendFormat: "{{file}} / skipped"
                      queryType: range
                      range: true
                    version: v0
                  refId: B
            queryOptions:
              interval: 1h
            transformations: []
        description:
          Last reported new/changed and skipped counts per file in each display interval. Inserted is the importer's label for upserts
          of new or changed features, not strictly newly created projects. Duplicate IDs can be processed repeatedly;
          successful file processing does not prove final import completion.
        id: 6
        links: []
        title: Import results per file
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                unit: short
                noValue: No matching logs
                color:
                  mode: palette-classic
                custom:
                  drawStyle: line
                  lineWidth: 2
                  pointSize: 6
                  showPoints: always
                  spanNulls: true
                  axisCenteredZero: false
                  axisPlacement: auto
                  fillOpacity: 0
              overrides: []
            options:
              legend:
                calcs:
                  - lastNotNull
                displayMode: table
                placement: right
                showLegend: true
              tooltip:
                mode: multi
                sort: desc
          version: 13.2.0-29316898481
    panel-7:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    datasource:
                      name: grafanacloud-logs
                    group: loki
                    kind: DataQuery
                    spec:
                      direction: backward
                      editorMode: code
                      expr: |-
                        last_over_time(
                          {service="osm-update"}
                          |~ `(Hard-deleted|Soft-detached) [0-9]+ stale projects`
                          | regexp `(?P<action>Hard-deleted|Soft-detached) (?P<projects>[0-9]+) stale projects`
                          | action!=""
                          | unwrap projects
                          | __error__="" [$__interval]
                        ) by (action)
                      instant: false
                      legendFormat: "{{action}}"
                      queryType: range
                      range: true
                    version: v0
                  refId: A
            queryOptions:
              interval: 1h
            transformations: []
        description:
          Last reported number of hard-deleted and soft-detached projects per display interval. Zero is
          a reported value. Missing points mean no matching cleanup message, not zero deletions.
        id: 7
        links: []
        title: Stale project cleanup
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                unit: short
                noValue: No matching logs
                color:
                  mode: palette-classic
                custom:
                  drawStyle: line
                  lineWidth: 2
                  pointSize: 6
                  showPoints: always
                  spanNulls: true
                  axisCenteredZero: false
                  axisPlacement: auto
                  fillOpacity: 0
              overrides: []
            options:
              legend:
                calcs:
                  - lastNotNull
                displayMode: table
                placement: right
                showLegend: true
              tooltip:
                mode: multi
                sort: desc
          version: 13.2.0-29316898481
    panel-8:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    datasource:
                      name: grafanacloud-logs
                    group: loki
                    kind: DataQuery
                    spec:
                      direction: backward
                      editorMode: code
                      expr: |-
                        last_over_time(
                          {service="osm-update"}
                          |~ `(peak memory used|min memory available|peak swap used)`
                          | regexp `(?P<measure>peak memory used|min memory available|peak swap used)[ ]*:[ ]*(?P<megabytes>[0-9]+)MB`
                          | measure!=""
                          | unwrap megabytes
                          | __error__="" [$__interval]
                        ) by (measure)
                      instant: false
                      legendFormat: "{{measure}}"
                      queryType: range
                      range: true
                    version: v0
                  refId: A
            queryOptions:
              interval: 1h
            transformations: []
        description:
          "Optional resource_monitor.sh summary: last reported host peak memory used, minimum memory available,
          and peak swap used per display interval. MB is shown as logged. This is host-wide usage during the update,
          not the extractor's own memory. Empty when that external monitor is not installed."
        id: 8
        links: []
        title: Host memory during updates
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                unit: "suffix: MB"
                noValue: No matching logs
                color:
                  mode: palette-classic
                custom:
                  drawStyle: line
                  lineWidth: 2
                  pointSize: 6
                  showPoints: always
                  spanNulls: true
                  axisCenteredZero: false
                  axisPlacement: auto
                  fillOpacity: 0
              overrides: []
            options:
              legend:
                calcs:
                  - lastNotNull
                displayMode: table
                placement: right
                showLegend: true
              tooltip:
                mode: multi
                sort: desc
          version: 13.2.0-29316898481
    panel-9:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    datasource:
                      name: grafanacloud-logs
                    group: loki
                    kind: DataQuery
                    spec:
                      direction: backward
                      editorMode: code
                      expr: |-
                        {service="osm-update"}
                        | logfmt
                        | level=~"warning|error|critical"
                        | __error__=""
                      instant: false
                      legendFormat: ""
                      queryType: range
                      range: true
                      maxLines: 1000
                    version: v0
                  refId: A
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    datasource:
                      name: grafanacloud-logs
                    group: loki
                    kind: DataQuery
                    spec:
                      direction: backward
                      editorMode: code
                      expr: |-
                        {service="osm-update"}
                        !~ `^time=`
                        |~ `(?i)(\berror\b|\bwarn(ing)?\b|\bfailed\b|traceback|out of memory|oom-kill)`
                      instant: false
                      legendFormat: ""
                      queryType: range
                      range: true
                      maxLines: 1000
                    version: v0
                  refId: B
            queryOptions: {}
            transformations: []
        description:
          Structured warning/error events, plus diagnostic text from native tools, the importer, and systemd. PID 1 diagnostics about this unit are included when the osm_manager Alloy source is deployed.
          Literal OOM KILLS summary headings are not considered errors.
        id: 9
        links: []
        title: Warnings and errors
        vizConfig:
          group: logs
          kind: VizConfig
          spec:
            fieldConfig:
              defaults: {}
              overrides: []
            options:
              dedupStrategy: none
              enableLogDetails: true
              prettifyLogMessage: false
              showCommonLabels: false
              showLabels: false
              showTime: true
              sortOrder: Descending
              wrapLogMessage: true
          version: 13.2.0-29316898481
    panel-11:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    datasource:
                      name: grafanacloud-logs
                    group: loki
                    kind: DataQuery
                    spec:
                      direction: backward
                      editorMode: code
                      expr: |-
                        last_over_time(
                          {service="osm-update"}
                          | logfmt
                          | component="update_daily" | event=~"step_completed|step_skipped" | dry_run="0"
                          | step=~"download|apply|refilter|derive|backfill|extraction|import"
                          | label_format step=`{{- if eq .step "download" -}}1. Download diffs
                            {{- else if eq .step "apply" -}}2. Apply diffs
                            {{- else if eq .step "refilter" -}}3. Re-filter subset
                            {{- else if eq .step "derive" -}}4. Derive sub-PBFs
                            {{- else if eq .step "backfill" -}}5. Backfill geometry
                            {{- else if eq .step "extraction" -}}6. Extract GeoJSON
                            {{- else if eq .step "import" -}}7. Import database
                            {{- end -}}`
                          | label_format duration_seconds=`{{ if eq .event "step_skipped" }}0{{ else }}{{ .duration_seconds }}{{ end }}`
                          | unwrap duration_seconds
                          | __error__="" [$__auto]
                        ) by (step)
                      instant: false
                      legendFormat: "{{step}}"
                      queryType: range
                      range: true
                    version: v0
                  refId: A
            queryOptions:
              interval: 1h
            # Align timestamps before ordering the final fields used for stacking.
            transformations:
              - kind: Transformation
                group: prepareTimeSeries
                spec:
                  options:
                    format: wide
              - kind: Transformation
                group: organize
                spec:
                  options:
                    excludeByName: {}
                    indexByName:
                      Time: 0
                      1. Download diffs: 1
                      2. Apply diffs: 2
                      3. Re-filter subset: 3
                      4. Derive sub-PBFs: 4
                      5. Backfill geometry: 5
                      6. Extract GeoJSON: 6
                      7. Import database: 7
                    renameByName: {}
        description:
          "Reported pipeline phase durations, stacked in execution order from bottom to top:
          download, apply, re-filter, derive, backfill, extraction, import. Extraction measures wall
          time for both parallel workers together. Explicitly skipped steps contribute zero; dry runs are excluded.
          Values are the latest per phase within each display interval and may come from different
          retries. Stack height excludes setup and backend restart. Markers show observations;
          lines connect across gaps. Backfill remains best-effort; inspect warnings for failures."
        id: 11
        links: []
        title: Reported step durations
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                unit: s
                noValue: No matching logs
                color:
                  mode: palette-classic-by-name
                custom:
                  drawStyle: line
                  lineInterpolation: linear
                  showPoints: always
                  pointSize: 4
                  spanNulls: true
                  axisCenteredZero: false
                  axisPlacement: auto
                  fillOpacity: 60
                  lineWidth: 1
                  stacking:
                    mode: normal
                    group: A
                min: 0
              overrides: []
            options:
              legend:
                calcs:
                  - lastNotNull
                displayMode: table
                placement: right
                showLegend: true
              tooltip:
                mode: multi
                sort: none
          version: 13.2.0-29316898481
    panel-12:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    datasource:
                      name: grafanacloud-logs
                    group: loki
                    kind: DataQuery
                    spec:
                      direction: backward
                      editorMode: code
                      expr: |-
                        last_over_time(
                          {service="osm-update"}
                          |= "Consumed " |= " CPU time"
                          | regexp `Consumed (?P<elapsed>.+?) CPU time`
                          | elapsed!=""
                          | label_format elapsed=`{{ .elapsed | replace "min" "m" | replace " " "" }}`
                          | unwrap duration_seconds(elapsed)
                          | __error__="" [$__interval]
                        ) by ()
                      instant: false
                      legendFormat: CPU time
                      queryType: range
                      range: true
                    version: v0
                  refId: A
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    datasource:
                      name: grafanacloud-logs
                    group: loki
                    kind: DataQuery
                    spec:
                      direction: backward
                      editorMode: code
                      expr: |-
                        last_over_time(
                          {service="osm-update"}
                          |= "Consumed " |= " CPU time"
                          | regexp `CPU time over (?P<elapsed>.+?) wall clock time`
                          | elapsed!=""
                          | label_format elapsed=`{{ .elapsed | replace "min" "m" | replace " " "" }}`
                          | unwrap duration_seconds(elapsed)
                          | __error__="" [$__interval]
                        ) by ()
                      instant: false
                      legendFormat: Elapsed time
                      queryType: range
                      range: true
                    version: v0
                  refId: B
            queryOptions:
              interval: 1h
            transformations: []
        description:
          Systemd end-of-run accounting, including backend restart. CPU time is cumulative across the service
          cgroup and can exceed elapsed time when work runs in parallel; it is not CPU utilization percent. Requires
          the osm_manager Alloy journal source. Failed runs can also report accounting values.
        id: 12
        links: []
        title: Service CPU and elapsed time
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                unit: s
                noValue: No matching logs
                color:
                  mode: palette-classic
                custom:
                  drawStyle: line
                  lineWidth: 2
                  pointSize: 6
                  showPoints: always
                  spanNulls: true
                  axisCenteredZero: false
                  axisPlacement: auto
                  fillOpacity: 0
                min: 0
              overrides: []
            options:
              legend:
                calcs:
                  - lastNotNull
                displayMode: table
                placement: right
                showLegend: true
              tooltip:
                mode: multi
                sort: desc
          version: 13.2.0-29316898481
    panel-13:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    datasource:
                      name: grafanacloud-logs
                    group: loki
                    kind: DataQuery
                    spec:
                      direction: backward
                      editorMode: code
                      expr: |-
                        last_over_time(
                          {service="osm-update"}
                          |= "Consumed " |= " CPU time"
                          | regexp `(?P<peak>[0-9]+(?:[.][0-9]+)?(?:[KMGTPE](?:i?B)?|B)?) memory peak`
                          | peak!=""
                          | label_format peak=`{{ regexReplaceAll "([KMGTPE])$" .peak "${1}iB" }}`
                          | unwrap bytes(peak)
                          | __error__="" [$__interval]
                        ) by ()
                      instant: false
                      legendFormat: Memory peak
                      queryType: range
                      range: true
                    version: v0
                  refId: A
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    datasource:
                      name: grafanacloud-logs
                    group: loki
                    kind: DataQuery
                    spec:
                      direction: backward
                      editorMode: code
                      expr: |-
                        last_over_time(
                          {service="osm-update"}
                          |= "Consumed " |= " CPU time"
                          | regexp `(?P<peak>[0-9]+(?:[.][0-9]+)?(?:[KMGTPE](?:i?B)?|B)?) memory swap peak`
                          | peak!=""
                          | label_format peak=`{{ regexReplaceAll "([KMGTPE])$" .peak "${1}iB" }}`
                          | unwrap bytes(peak)
                          | __error__="" [$__interval]
                        ) by ()
                      instant: false
                      legendFormat: Swap peak
                      queryType: range
                      range: true
                    version: v0
                  refId: B
            queryOptions:
              interval: 1h
            transformations: []
        description:
          Systemd cgroup memory/swap peaks. Values such as 5.2G are rounded human-readable accounting values,
          interpreted as binary units. These describe the OSM service, unlike the host-wide memory panel. Requires the
          osm_manager Alloy source.
        id: 13
        links: []
        title: Service peak memory and swap
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                unit: bytes
                noValue: No matching logs
                color:
                  mode: palette-classic
                custom:
                  drawStyle: line
                  lineWidth: 2
                  pointSize: 6
                  showPoints: always
                  spanNulls: true
                  axisCenteredZero: false
                  axisPlacement: auto
                  fillOpacity: 0
                min: 0
              overrides: []
            options:
              legend:
                calcs:
                  - lastNotNull
                displayMode: table
                placement: right
                showLegend: true
              tooltip:
                mode: multi
                sort: desc
          version: 13.2.0-29316898481
    panel-14:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    datasource:
                      name: grafanacloud-logs
                    group: loki
                    kind: DataQuery
                    spec:
                      direction: backward
                      editorMode: code
                      expr: |-
                        last_over_time(
                          {service="osm-update"}
                          |= "peak PSI mem "
                          | regexp `peak PSI mem (?P<pressure>some10|full10)[ ]*:[ ]*(?P<percent>[0-9]+(?:[.][0-9]+)?)%`
                          | pressure!=""
                          | unwrap percent
                          | __error__="" [$__interval]
                        ) by (pressure)
                      instant: false
                      legendFormat: "{{pressure}}"
                      queryType: range
                      range: true
                    version: v0
                  refId: A
            queryOptions:
              interval: 1h
            transformations: []
        description:
          "Optional resource monitor: peak reported 10-second PSI memory some/full percentages during each
          update window. These measure memory stalls, not memory capacity consumed. Values are host-wide, and the two
          peaks need not occur together."
        id: 14
        links: []
        title: Host memory pressure during updates
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                unit: percent
                noValue: No matching logs
                color:
                  mode: palette-classic
                custom:
                  drawStyle: line
                  lineWidth: 2
                  pointSize: 6
                  showPoints: always
                  spanNulls: true
                  axisCenteredZero: false
                  axisPlacement: auto
                  fillOpacity: 0
                min: 0
                max: 100
              overrides: []
            options:
              legend:
                calcs:
                  - lastNotNull
                displayMode: table
                placement: right
                showLegend: true
              tooltip:
                mode: multi
                sort: desc
          version: 13.2.0-29316898481
    panel-15:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    datasource:
                      name: grafanacloud-logs
                    group: loki
                    kind: DataQuery
                    spec:
                      direction: backward
                      editorMode: code
                      expr: |-
                        last_over_time(
                          {service="osm-update"}
                          |= "min disk available"
                          | regexp `min disk available[ ]*:[ ]*(?P<gigabytes>[0-9]+(?:[.][0-9]+)?)GB`
                          | gigabytes!=""
                          | unwrap gigabytes
                          | __error__="" [$__interval]
                        ) by ()
                      instant: false
                      legendFormat: Minimum available
                      queryType: range
                      range: true
                    version: v0
                  refId: A
            queryOptions:
              interval: 1h
            transformations: []
        description:
          "Optional resource monitor: minimum free disk space during the update, in GB as logged. This is
          not input/output file size or disk I/O throughput."
        id: 15
        links: []
        title: Minimum disk space during updates
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                unit: "suffix: GB"
                noValue: No matching logs
                color:
                  mode: palette-classic
                custom:
                  drawStyle: line
                  lineWidth: 2
                  pointSize: 6
                  showPoints: always
                  spanNulls: true
                  axisCenteredZero: false
                  axisPlacement: auto
                  fillOpacity: 0
                min: 0
              overrides: []
            options:
              legend:
                calcs:
                  - lastNotNull
                displayMode: table
                placement: right
                showLegend: true
              tooltip:
                mode: multi
                sort: desc
          version: 13.2.0-29316898481
    panel-17:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    datasource:
                      name: grafanacloud-logs
                    group: loki
                    kind: DataQuery
                    spec:
                      direction: backward
                      editorMode: code
                      expr: |-
                        last_over_time(
                          {service="osm-update"}
                          | regexp `^\s*(?P<process>python3|bun|osmium|postgres|java)\s+(?P<megabytes>[0-9]+)MB$`
                          | process!=""
                          | unwrap megabytes
                          | __error__="" [$__interval]
                        ) by (process)
                      instant: false
                      legendFormat: "{{process}}"
                      queryType: range
                      range: true
                    version: v0
                  refId: A
            queryOptions:
              interval: 1h
            transformations: []
        description:
          Optional resource monitor RSS summary for Python, Bun, osmium, Postgres and Java. Names identify
          processes across the host, not a particular extractor or container. Lines connect reported peaks;
          markers identify actual samples. Peaks need not occur together and are not added together.
        id: 17
        links: []
        title: Reported process RSS peaks
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                unit: "suffix: MB"
                noValue: No matching logs
                color:
                  mode: palette-classic
                custom:
                  drawStyle: line
                  lineInterpolation: linear
                  pointSize: 4
                  showPoints: always
                  spanNulls: true
                  axisCenteredZero: false
                  axisPlacement: auto
                  fillOpacity: 0
                  lineWidth: 1
                min: 0
              overrides: []
            options:
              legend:
                calcs:
                  - lastNotNull
                displayMode: table
                placement: right
                showLegend: true
