# AI : Cloudflare Worker configuration for full-stack app
name = "construction-map"
main = "back/worker/index.ts"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]

# AI : Assets configuration for frontend files
[assets]
directory = "front/dist"
binding = "ASSETS"

[observability.logs]
enabled = true

# AI : Production environment configuration
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "construction-map-uploads" #production

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "53021ecf4ac94d2a8555d8f11022aa44" # production construction-map-supabase Hyperdrive UUID
localConnectionString = "postgresql://default:password@localhost:5432/postgres"

# AI : Preview environment configuration
[env.preview]
name = "construction-map-preview"

[[env.preview.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "construction-map-preview-uploads"

[[env.preview.hyperdrive]]
binding = "HYPERDRIVE"
id = "e2def509776048209ef7b2a5b92efaca" # preview
