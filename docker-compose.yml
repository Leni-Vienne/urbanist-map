# Environment-agnostic Docker Compose for both production and preview
# Use with: docker compose --env-file .env.prod up -d
# Or with: docker compose --env-file .env.preview up -d
#
# Every service caps its json-file log. Without this Docker keeps the whole log for the container's
# lifetime, so request lines (which contain IP addresses) would outlive the retention promised in
# the privacy policy. Grafana Cloud Loki is the durable store, so what sits on disk here only has to
# cover local debugging.

services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-construction_map}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - app-network
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "max_parallel_workers_per_gather=0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-construction_map}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: ${DB_LOG_MAX_SIZE:-5m}
        max-file: "${DB_LOG_MAX_FILE:-3}"

  # Backend web server, running directly on the official Bun Alpine image.
  # Image processing uses Bun.Image (no native deps needed).
  backend:
    image: oven/bun:1.3.14-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      COOKIE_SECRET: ${COOKIE_SECRET}
      CORS_ORIGIN: "${CORS_ORIGIN}"
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      OSM_CLIENT_ID: ${OSM_CLIENT_ID}
      OSM_CLIENT_SECRET: ${OSM_CLIENT_SECRET}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SES_REGION: ${SES_REGION}
      FROM_EMAIL: ${FROM_EMAIL}
      FRONTEND_URL: ${FRONTEND_URL}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      ALERT_EMAIL: ${ALERT_EMAIL}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    user: bun
    volumes:
      - ./server.bundle.js:/home/bun/app/server.bundle.js:ro
      - ./back/src/email:/home/bun/app/email:ro
      - ./back/src/routes:/home/bun/app/routes:ro
      - ./uploads:/home/bun/app/uploads
    working_dir: /home/bun/app
    command: ["bun", "./server.bundle.js"]
    ports:
      # Expose backend to host for Caddy reverse proxy access
      - "${BACKEND_PORT:-3000}:3000"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Request logs carry client IPs, so this is the cap that bounds how long they live on disk.
    logging:
      driver: json-file
      options:
        max-size: ${BACKEND_LOG_MAX_SIZE:-10m}
        max-file: "${BACKEND_LOG_MAX_FILE:-3}"

  # Grafana Alloy - Log shipper that captures stdout and sends to Loki
  alloy:
    image: grafana/alloy:latest
    container_name: ${COMPOSE_PROJECT_NAME}-alloy
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
      # Host journal, read by the osm-update log source (machine-id resolves the journal directory).
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    environment:
      # Grafana Cloud Loki push endpoint, instance ID, and token (names match the Grafana onboarding script)
      GCLOUD_HOSTED_LOGS_URL: ${GCLOUD_HOSTED_LOGS_URL}
      GCLOUD_HOSTED_LOGS_ID: ${GCLOUD_HOSTED_LOGS_ID}
      GCLOUD_RW_API_KEY: ${GCLOUD_RW_API_KEY}
      # Project name for container filtering in alloy-config.alloy
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      # Systemd unit whose journal is shipped. Empty on every stack that must not ship it.
      JOURNAL_UNIT: ${JOURNAL_UNIT:-}
    networks:
      - app-network
    ports:
      - "${ALLOY_PORT:-12345}:12345" # Alloy UI
    logging:
      driver: json-file
      options:
        max-size: ${ALLOY_LOG_MAX_SIZE:-5m}
        max-file: "${ALLOY_LOG_MAX_FILE:-3}"

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME}-postgres-data
    driver: local
  alloy_data:
    name: ${COMPOSE_PROJECT_NAME}-alloy-data
    driver: local

networks:
  app-network:
    name: ${COMPOSE_PROJECT_NAME}-network
    driver: bridge
